[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clauthing-gmail-mcp"
version = "0.1.0"
description = "Read-only Gmail for LLMs with selective, revocable client permissions"
requires-python = ">=3.11"
dependencies = ["google-auth-oauthlib>=1.2,<2"]

[project.scripts]
clauthing-gmail-mcp = "clauthing_gmail_mcp.cli:main"
clauthing-gmail = "clauthing_gmail_mcp.cli:main"

[tool.setuptools.packages.find]
include = ["clauthing_gmail_mcp*"]
